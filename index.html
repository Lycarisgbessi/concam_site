<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Applique le thème AVANT le premier rendu (anti-flash).
      // Préférence enregistrée > préférence système.
      (function () {
        try {
          var t = localStorage.getItem('concam_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>CONCAM — Agence de Communication & Marketing à Conakry, Guinée</title>
    <meta
      name="description"
      content="Agence conseil 360° à Conakry depuis 2010 : stratégie de communication, impression numérique et offset, manuels institutionnels, marquage publicitaire et édition de presse."
    />
    <meta property="og:title" content="CONCAM — Agence de Communication & Marketing à Conakry, Guinée" />

      property="og:description"
      content="Agence conseil 360° à Conakry depuis 2010 : stratégie de communication, impression numérique et offset, manuels institutionnels, marquage publicitaire et édition de presse."
