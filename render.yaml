# Déploiement Render.com — Site institutionnel CONCAM
# New → Blueprint → sélectionner le dépôt Lycarisgbessi/concam_site
services:
  - type: web
    name: concam-site
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Base PostgreSQL Neon (à coller dans le dashboard Render — jamais commitée)
      - key: DATABASE_URL
        sync: false
      # Clé Gemini pour le Conseiller IA (optionnelle : repli déterministe si absente)
      - key: GEMINI_API_KEY
        sync: false
      # Secret de signature des sessions admin (généré par Render)
      - key: SESSION_SECRET
        generateValue: true
      # URL publique du site (ex. https://concam-site.onrender.com) — utile au sitemap
      - key: APP_URL
        sync: false
      # Mots de passe initiaux des comptes admin (optionnel — voir GUIDE_EXPLOITATION_CONCAM.md)
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_EDITOR_PASSWORD
        sync: false
      - key: SEED_SALES_PASSWORD
        sync: false
